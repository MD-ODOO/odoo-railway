[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = ["/usr/local/bin/kiiraaye-upgrade.sh"]
startCommand = "/bin/sh -c 'exec odoo --db_host=\"${ODOO_DB_HOST:-postgres.railway.internal}\" --db_port=\"${ODOO_DB_PORT:-5432}\" --db_user=\"${ODOO_DB_USER:-odoo}\" --db_password=\"${ODOO_DB_PASSWORD:-}\"'"
healthcheckPath = "/web"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"