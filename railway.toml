[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = ["/usr/local/bin/kiiraaye-upgrade.sh"]
startCommand = "/bin/sh -c 'exec odoo --db_host=$ODOO_DB_HOST --db_port=$ODOO_DB_PORT --db_user=$ODOO_DB_USER --db_password=$ODOO_DB_PASSWORD'"
healthcheckPath = "/web"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"